<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>בדיוק בערך</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: explorer's notebook beside an encyclopedia sheet; heat scale is the only loud color */
:root{
  --paper:#EEF1EE; --sheet:#FFFFFF; --ink:#1B2A2E; --ink-2:#51625F; --line:#D3DBD7;
  --accent:#2E4C9E; --accent-soft:#E2E8F6; --stamp:#B5462E; --link:#2E4C9E;
  --cold:#3E7CB1; --mild:#6E9E95; --warm:#D3952A; --hot:#D2552B; --found:#2E8B57;
  --ok-bg:#E3F2E8; --ok-fg:#1F5E3B; --bad-bg:#F8E4DF; --bad-fg:#8A2E1C;
  --shade:rgba(20,30,32,.55);
  --font-read:"Frank Ruhl Libre","David Libre","Times New Roman",serif;
  --font-ui:"Rubik","Assistant","Arial Hebrew",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111718; --sheet:#192124; --ink:#E3ECEA; --ink-2:#9FB0AD; --line:#2B3739;
  --accent:#93A9F2; --accent-soft:#232D47; --stamp:#E58466; --link:#A3B6F6;
  --cold:#6FA6D6; --mild:#86BAAE; --warm:#E8B04F; --hot:#EE7A4F; --found:#5CC08A;
  --ok-bg:#183626; --ok-fg:#A6E2BE; --bad-bg:#3D1F18; --bad-fg:#F2B4A3; --shade:rgba(0,0,0,.65);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111718; --sheet:#192124; --ink:#E3ECEA; --ink-2:#9FB0AD; --line:#2B3739;
  --accent:#93A9F2; --accent-soft:#232D47; --stamp:#E58466; --link:#A3B6F6;
  --cold:#6FA6D6; --mild:#86BAAE; --warm:#E8B04F; --hot:#EE7A4F; --found:#5CC08A;
  --ok-bg:#183626; --ok-fg:#A6E2BE; --bad-bg:#3D1F18; --bad-fg:#F2B4A3; --shade:rgba(0,0,0,.65);
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--font-ui);font-size:16px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
h1,h2,h3{font-family:var(--font-read);text-wrap:balance;margin:0}
button,input,select{font-family:var(--font-ui);font-size:16px;color:var(--ink)}
button{cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--sheet);padding:9px 16px}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--sheet);font-weight:500}
button.ghost{background:transparent}
input,select{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:9px 12px;width:100%}
.wrap{max-width:1180px;margin:0 auto}
.label{font-size:13px;color:var(--ink-2);letter-spacing:.02em}
.err{color:var(--bad-fg);font-size:14px;min-height:1.2em}
/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{font-family:var(--font-read);font-weight:900;font-size:22px;letter-spacing:-.01em}
.brand span{color:var(--stamp)}
.stats{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:500}
.heat{display:flex;align-items:center;gap:8px;margin-inline-start:auto}
.cells{display:flex;gap:3px}
.cells i{width:22px;height:12px;border-radius:3px;background:var(--line);transition:background .4s}
.heat-label{font-size:14px;font-weight:500;min-width:52px}
/* setup */
.setup{max-width:760px;margin:28px auto 0;display:grid;gap:22px}
.hero h1{font-size:clamp(38px,7vw,64px);font-weight:900;line-height:1.05}
.hero h1 span{color:var(--stamp)}
.hero p{font-family:var(--font-read);font-size:19px;color:var(--ink-2);max-width:60ch;margin:10px 0 0}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:20px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.field{display:grid;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border-radius:999px;padding:7px 14px;font-size:15px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:500}
.rules{margin:0;padding-inline-start:20px;display:grid;gap:6px;color:var(--ink-2)}
.resume{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;border:1.5px dashed var(--accent);background:var(--accent-soft)}
/* start pick */
.pick{max-width:900px;margin:24px auto 0;display:grid;gap:18px}
.clue-hero{font-family:var(--font-read);font-size:24px;line-height:1.4;border-inline-start:4px solid var(--stamp);padding:6px 14px 6px 0;border-radius:0}
.stations{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.stations button{text-align:start;font-family:var(--font-read);font-size:18px;padding:14px;min-height:64px}
/* play */
.play{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px;margin-top:18px;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:grid;gap:14px;max-height:calc(100vh - 96px);overflow:auto;padding-bottom:4px}
.note{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px}
.note h3{font-size:18px}
.clues{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.clues li{font-family:var(--font-read);font-size:17px;line-height:1.45;padding:8px 10px;background:var(--paper);border-radius:8px}
.clues li small{display:block;font-family:var(--font-ui);font-size:12px;color:var(--stamp);font-weight:500}
.clues li.locked{color:var(--ink-2);font-family:var(--font-ui);font-size:14px;background:transparent;border:1px dashed var(--line)}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0}
.pieces{display:flex;flex-wrap:wrap;gap:6px}
.piece{font-size:14px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--paper)}
.piece.done{background:var(--ok-bg);color:var(--ok-fg);border-color:transparent}
.piece.now{border-color:var(--stamp);color:var(--stamp);font-weight:500}
.path{font-size:13px;color:var(--ink-2);line-height:1.7}
.path b{color:var(--ink);font-weight:500}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:22px clamp(16px,4vw,40px) 40px;min-width:0}
.sheet-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px}
.sheet-head h1{font-size:clamp(28px,4vw,40px);font-weight:700}
.article{font-family:var(--font-read);font-size:18.5px;line-height:1.75;max-width:70ch;overflow-wrap:anywhere}
.article p{margin:0 0 1em}
.article h2,.article h3{font-family:var(--font-read);margin:1.4em 0 .5em}
.article h2{font-size:26px;border-bottom:1px solid var(--line);padding-bottom:4px}
.article h3{font-size:21px}
.article a.wl{color:var(--link);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--link) 35%,transparent);text-underline-offset:3px}
.article a.wl.warm{background:color-mix(in srgb,var(--warm) 28%,transparent);border-radius:3px;text-decoration-color:var(--warm);box-shadow:0 0 0 2px color-mix(in srgb,var(--warm) 28%,transparent)}
.warmlist{display:flex;flex-wrap:wrap;gap:6px}
.warmlist button{font-family:var(--font-read);font-size:15px;padding:4px 10px;border-color:var(--warm)}
.near{display:block;font-family:var(--font-ui);font-size:12px;color:var(--warm);font-weight:500}
.article a.wl:hover{text-decoration-color:var(--link);background:var(--accent-soft)}
.article img{max-width:100%;height:auto}
.article figure,.article .thumb{margin:0 0 1em;max-width:100%}
.article figure,.article .thumb,.article .infobox,.article table.infobox{float:none!important}
.article table{display:block;max-width:100%;overflow-x:auto;border-collapse:collapse;font-family:var(--font-ui);font-size:14px;margin:0 0 1.2em}
.article td,.article th{border:1px solid var(--line);padding:4px 8px;vertical-align:top}
.article figcaption,.article .thumbcaption{font-size:14px;color:var(--ink-2);font-family:var(--font-ui)}
.article ul,.article ol{padding-inline-start:24px}
.article .mw-gallery-traditional,.article .gallery{display:none}
.loading{color:var(--ink-2);font-family:var(--font-ui);padding:40px 0}
.toolbar{display:flex;gap:8px;align-items:center}
/* modal */
.shade{position:fixed;inset:0;background:var(--shade);z-index:50;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--sheet);border-radius:14px;max-width:560px;width:100%;padding:24px;display:grid;gap:14px;max-height:90vh;overflow:auto}
.modal h2{font-size:26px}
.stamp{display:inline-block;font-family:var(--font-ui);font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--stamp);border:1.5px solid var(--stamp);border-radius:4px;padding:2px 8px;transform:rotate(-3deg)}
.gate-text{font-family:var(--font-read);font-size:20px;line-height:1.6;background:var(--paper);border-radius:10px;padding:14px}
.blank{display:inline-block;min-width:80px;border-bottom:2px solid var(--stamp);margin:0 4px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.opts button{font-family:var(--font-read);font-size:19px}
.opts button.right{background:var(--ok-bg);color:var(--ok-fg);border-color:transparent}
.opts button.wrong{background:var(--bad-bg);color:var(--bad-fg);border-color:transparent}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;z-index:60;font-size:15px;max-width:90vw}
/* end */
.end{max-width:760px;margin:28px auto 0;display:grid;gap:18px}
.score-big{font-family:var(--font-read);font-size:72px;font-weight:900;line-height:1;color:var(--stamp);font-variant-numeric:tabular-nums}
table.board{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px}
table.board td,table.board th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:start}
table.board th{font-weight:500;color:var(--ink-2);font-size:13px}
.learned{display:grid;gap:10px}
.learned div{border-inline-start:3px solid var(--found);padding:2px 12px 2px 0;border-radius:0}
.learned b{font-family:var(--font-read);font-size:19px}
.learned p{margin:4px 0 0;color:var(--ink-2);font-family:var(--font-read)}
@media (max-width:860px){
  .play{grid-template-columns:minmax(0,1fr)}
  .side{position:static;max-height:none;order:-1}
  .heat{margin-inline-start:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand">בדיוק <span>בערך</span></div>
  <div class="stats" id="stats"></div>
  <div class="heat" id="heatBox" hidden>
    <div class="cells" id="cells"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="heat-label" id="heatLabel">—</div>
  </div>
</div></header>
<main class="wrap" id="app"></main>
<div id="modalRoot"></div>

<script>
const API='https://he.wikipedia.org/w/api.php';
const LS_GAME='bediyuk-baerech.game.v1', LS_BOARD='bediyuk-baerech.board.v1';
const LEVELS={kids:'ילדים (8–12)',teens:'נוער',adults:'מבוגרים'};
const DOMAINS={mix:'הכול',geo:'גיאוגרפיה',sci:'מדע',art:'אמנות',music:'מוזיקה',hist:'היסטוריה'};
const DIFFS={easy:'קל',medium:'בינוני',hard:'קשה'};
const DCFG={
 easy:  {start:3,step:{kids:1,teens:1,adults:1},gate:{kids:3,teens:2,adults:2},near:4,mark:true,mult:1},
 medium:{start:2,step:{kids:1,teens:2,adults:2},gate:{kids:2,teens:1,adults:1},near:3,mark:true,mult:1.5},
 hard:  {start:1,step:{kids:2,teens:3,adults:4},gate:{kids:1,teens:1,adults:1},near:2,mark:false,mult:2}};
const dc=()=>DCFG[S.diff]||DCFG.medium;
function clueSched(){const c=dc(),st=c.step[S.level]||2;return [0,1,2,3,4].map(i=>i<c.start?0:(i-c.start+1)*st)}
function compassMode(){return S.diff==='easy'||(S.diff!=='hard'&&S.level==='kids')?'auto':S.diff==='hard'?'paid':'free'}
function showChoices(wrong){return S.diff==='easy'||(S.diff!=='hard'&&wrong>=2)}
const TI={};
const BAD_CAT=/ערכים|דפים|קצרמר|מיזם|ויקינתונים|תבנית|קואורדינטות|שגיאות|ללא/;
const HEAT=[{t:'קר',c:'--cold'},{t:'פושר',c:'--mild'},{t:'חם',c:'--warm'},{t:'רותח',c:'--hot'},{t:'הגעת!',c:'--found'}];
const STOP_SECTIONS=['הערות שוליים','קישורים חיצוניים','לקריאה נוספת','ראו גם','מקורות','ביבליוגרפיה','הערות'];
const START_POOL=['השמש','הירח','כדור הארץ','מחשב','כדורגל','ברזל','האוקיינוס האטלנטי','חתול הבית','רכבת','שוקולד','אינטרנט','דינוזאורים','גשם','תיאטרון','המשחקים האולימפיים','זהב','קפה','אופניים','מטוס','חלב','נמר','מתמטיקה','חשמל','מלח','ענן','שעון','מגדלור','מדבר','ספינה','לחם','גיטרה','צילום','ספרייה','אש','שחמט','הר האוורסט','דפוס','ים','אגם','חיטה','דולפינים','קרח'];

const PUZZLES=[
 {id:'egypt',domain:'geo',levels:['kids','teens','adults'],meta:{a:'מצרים',al:['ארץ מצרים','מצריים'],q:'כל הערכים הנסתרים שייכים לארץ אחת. מהי?'},pieces:[
  {t:'נילוס',al:['נהר הנילוס','הנילוס'],c:['אני עובר דרך כמה מדינות ואף פעם לא עוצר.','לפני שבנו סכר גדול, הייתי עולה על גדותיי כל שנה ומשקה את השדות.','אני נשפך לים התיכון בדלתא רחבה, ונחשב לאחד הנהרות הארוכים בעולם.']},
  {t:'תעלת סואץ',al:['סואץ'],c:['אני קיצור דרך שחסך לספינות הקפה סביב יבשת שלמה.','נחפרתי במאה ה־19 ואין בי אף סכר.','אני מחברת את הים התיכון לים סוף.']},
  {t:'קהיר',al:[],c:['חיים בי מיליוני אנשים.','אני בירה, ובשוליי עומדים מבנים בני אלפי שנים.','אני העיר הגדולה בעולם הערבי, ושוכנת על גדות נהר ארוך.']},
  {t:'הפירמידה הגדולה של גיזה',al:['פירמידת חאופס','הפירמידה של חאופס','פירמידות גיזה','הפירמידה הגדולה','פירמידה'],c:['אני עשוי מאבן, ואני ותיק מאוד.','במשך אלפי שנים הייתי המבנה הגבוה ביותר שבנו בני אדם.','אני היחיד משבעת פלאי תבל העתיקים שעדיין עומד.']}]},
 {id:'newton',domain:'sci',levels:['kids','teens'],meta:{a:'אייזק ניוטון',al:['ניוטון','אייזיק ניוטון','סר אייזק ניוטון','יצחק ניוטון'],q:'מדען אחד קושר את כל הערכים הנסתרים. מי הוא?'},pieces:[
  {t:'כבידה',al:['כוח הכבידה','כוח המשיכה','גרביטציה','משיכה'],c:['אני תמיד איתך, גם כשאתה לא שם לב אליי.','בזכותי הירח לא בורח מכדור הארץ.','אני הכוח שגורם לחפצים ליפול למטה.']},
  {t:'טלסקופ',al:['טלסקופ מחזיר אור','טלסקופים'],c:['אני עוזר לראות דברים רחוקים.','יש לי עדשות או מראות, ואסטרונומים אוהבים אותי.','גלילאו הפנה אותי לשמיים וגילה ירחים של צדק.']},
  {t:"אוניברסיטת קיימברידג'",al:["קיימברידג'","אוניברסיטת קמברידג'","קמברידג'"],c:['אני מקום שבו לומדים כבר מאות שנים.','אני באנגליה, ויש לי מתחרה ותיקה בשם אוקספורד.','אני אחת האוניברסיטאות העתיקות בעולם, ונהר קם זורם לידי.']},
  {t:'מנסרה',al:['פריזמה','מנסרה (אופטיקה)'],c:['אני שקופה, ויש לי פינות.','כשאור לבן עובר דרכי, הוא יוצא אחרת.','אני מפרקת אור לבן לצבעי הקשת.']}]},
 {id:'leonardo',domain:'art',levels:['teens','adults'],meta:{a:"לאונרדו דה וינצ'י",al:['לאונרדו',"דה וינצ'י",'לאונרדו דה וינצי','דה וינצי','לאונרדו דה-וינצ\'י'],q:'אמן אחד קושר את כל הערכים הנסתרים. מיהו?'},pieces:[
  {t:'מונה ליזה',al:["ג'וקונדה","לה ג'וקונדה",'המונה ליזה'],c:['אני קטנה יותר ממה שרוב האנשים מצפים.','אני תלויה מאחורי זכוכית במוזיאון בפריז, ותמיד יש מולי המון אנשים.','החיוך שלי הוא אחד המפורסמים בעולם.']},

function norm(s){return String(s||'').replace(/[\u0591-\u05C7]/g,'').replace(/["'״׳`’‘]/g,'').replace(/[-–—_]/g,' ').replace(/\(.*?\)/g,'').replace(/\s+/g,' ').trim().toLowerCase()}
function normSet(list){const out=new Set();list.filter(Boolean).forEach(x=>{const n=norm(x);out.add(n);if(n.startsWith('ה')&&n.length>2)out.add(n.slice(1));out.add('ה'+n)});return out}

let useJsonp=false,lastErr='',jp=0;
function jsonp(params){
  return new Promise((res,rej)=>{
    const cb='__wcb'+(++jp),u=new URL(API),sc=document.createElement('script');
    Object.entries({...params,format:'json',formatversion:2,callback:cb}).forEach(([k,v])=>u.searchParams.set(k,v));
    const done=()=>{delete window[cb];sc.remove()};
    const t=setTimeout(()=>{done();rej(new Error('timeout'))},15000);
    window[cb]=d=>{clearTimeout(t);done();res(d)};
    sc.onerror=()=>{clearTimeout(t);done();rej(new Error('script blocked'))};
    sc.src=u.toString();document.head.appendChild(sc);
  });
}
async function api(params){
  if(!useJsonp){
    try{
      const u=new URL(API);
      Object.entries({...params,format:'json',formatversion:2,origin:'*'}).forEach(([k,v])=>u.searchParams.set(k,v));
      const r=await fetch(u);if(!r.ok)throw new Error('http '+r.status);return await r.json();
    }catch(e){lastErr='fetch: '+e.message;useJsonp=true}
  }
  try{return await jsonp(params)}catch(e){lastErr+=' | jsonp: '+e.message;throw e}
}
async function resolveTitle(cands){
  const r=await api({action:'query',titles:cands.slice(0,40).join('|'),redirects:1,prop:'pageprops',ppprop:'disambiguation'});
  const q=r.query||{},pages=(q.pages||[]).filter(p=>!p.missing&&!p.invalid&&!(p.pageprops&&'disambiguation' in p.pageprops));
  if(!pages.length)return null;
  const map={};(q.normalized||[]).forEach(x=>map[x.from]=x.to);(q.redirects||[]).forEach(x=>map[x.from]=x.to);
  for(const c of cands){let x=c;for(let k=0;k<4&&map[x];k++)x=map[x];const pg=pages.find(p=>p.title===x);if(pg)return pg.title}
  return pages[0].title;
}

async function targetInfo(T){
  if(TI[T])return TI[T];
  const info={out:new Set(),cat:''};
  try{
    let cont={};
    for(let k=0;k<4;k++){
      const r=await api({action:'query',titles:T,prop:'links',plnamespace:0,pllimit:'max',...cont});
      ((r.query&&r.query.pages||[])[0]||{}).links?.forEach(l=>info.out.add(l.title));
      if(!r.continue)break;cont=r.continue;
    }
    const c=await api({action:'query',titles:T,prop:'categories',clshow:'!hidden',cllimit:'max'});
    const cats=(((c.query&&c.query.pages||[])[0]||{}).categories||[]).map(x=>x.title.replace(/^קטגוריה:/,'')).filter(x=>!BAD_CAT.test(x));
    const b=base(T);info.cat=cats.find(x=>!x.includes(b))||'';
  }catch(e){}
  TI[T]=info;return info;
}
async function findWarmLinks(T){
  const art=$('#article');if(!art)return[];
  const info=await targetInfo(T);
  const titles=[...new Set([...art.querySelectorAll('a.wl')].map(a=>a.dataset.wt))].slice(0,150);
  const warm=new Set();
  for(let i=0;i<titles.length;i+=50){
    const batch=titles.slice(i,i+50);
    try{
      const r=await api({action:'query',titles:batch.join('|'),redirects:1,prop:'links',pltitles:T});
      const q=r.query||{},map={};(q.normalized||[]).forEach(x=>map[x.from]=x.to);(q.redirects||[]).forEach(x=>map[x.from]=x.to);
      const linking=new Set((q.pages||[]).filter(pg=>pg.links&&pg.links.length).map(pg=>pg.title));
      batch.forEach(t=>{let c=t;for(let k=0;k<3&&map[c];k++)c=map[c];if(c===T||linking.has(c)||info.out.has(c))warm.add(t)});
    }catch(e){}
  }
  return [...warm];
}

/* ---------- article cleaning ---------- */
function cleanArticle(html){
  const doc=new DOMParser().parseFromString(html,'text/html');
  const root=doc.querySelector('.mw-parser-output')||doc.body;
  root.querySelectorAll('style,script,link,meta,.mw-editsection,sup.reference,.reference,.mw-references-wrap,ol.references,.navbox,.navbox-styles,.metadata,.ambox,.noprint,.mw-empty-elt,.hatnote,.dablink,.sistersitebox,.toc,#toc,.catlinks,.mw-authority-control,.gallery').forEach(e=>e.remove());
  let cutting=false;
  [...root.children].forEach(el=>{
    const h=el.matches('h2')?el:(el.matches('.mw-heading2')?el.querySelector('h2'):null);
    if(h){const t=h.textContent.trim();cutting=STOP_SECTIONS.some(s=>t.startsWith(s))}
    if(cutting)el.remove();
  });
  root.querySelectorAll('img').forEach(img=>{['src','srcset'].forEach(a=>{const v=img.getAttribute(a);if(v)img.setAttribute(a,v.replace(/(^|,\s*)\/\//g,'$1https://'))});img.setAttribute('loading','lazy');img.removeAttribute('height')});
  root.querySelectorAll('a').forEach(a=>{
    const href=a.getAttribute('href')||'';let t=null;
    const m=href.match(/^(?:\/wiki\/|\.\/)([^#?]+)/);
    if(m&&!a.classList.contains('new')&&!a.querySelector('img')){try{t=decodeURIComponent(m[1]).replace(/_/g,' ')}catch(e){t=null}if(t&&t.includes(':'))t=null}
    if(t){a.setAttribute('data-wt',t);a.setAttribute('href','#');a.className='wl';[...a.attributes].forEach(at=>{if(!['data-wt','href','class'].includes(at.name))a.removeAttribute(at.name)})}
    else{const sp=doc.createElement('span');sp.innerHTML=a.innerHTML;a.replaceWith(sp)}
  });
  return root.innerHTML;
}

    <li>מעט תחנות, מעט רמזים קנויים ושערים נכונים מביאים ניקוד גבוה. ההתקדמות נשמרת, ואפשר להמשיך מתי שרוצים.</li>

  </div>`;

function nextClueIn(p){const sched=clueSched();if(p.shown>=clueCount(p))return null;return Math.max(0,sched[p.shown]-p.stations)}
function letterHint(p){const b=base(p.title);const words=b.split(/\s+/).length;return `מתחיל באות "${b[0]}", ${b.replace(/[\s'"׳״-]/g,'').length} אותיות${words>1?`, ${words} מילים`:''}.`}
function clueCount(p){return (TI[p.title]&&TI[p.title].cat)?5:4}
function clueText(p,i){if(i<3)return p.c[i];const cat=TI[p.title]&&TI[p.title].cat;if(i===3&&cat)return `בוויקיפדיה היעד שייך לנושא: "${cat}".`;return letterHint(p)}
function updateClues(p){const n=clueSched().filter(x=>p.stations>=x).length;const mx=clueCount(p);if(n>p.shown&&p.shown<mx){p.shown=Math.min(mx,n);toast('רמז חדש נחשף')}}
function compassHtml(p){

  }else h+=auto?`<div id="compassOut"><span class="label">המצפן מחפש…</span></div>`:`<div id="compassOut" class="label">המצפן מסמן בדף את הקישורים שקרובים ליעד.</div><div><button class="ghost" id="compassBtn">${mode==='paid'?'להפעיל מצפן (3- נקודות)':'להפעיל מצפן'}</button></div>`;

async function loadArticle(title,{count=true,noHistory=false}={}){
  busy=true;const art=$('#article');if(art)art.style.opacity='.45';

  catch(e){busy=false;if(art)art.style.opacity='1';toast('לא הצלחתי לפתוח את הערך. נסו קישור אחר.');return false}
  const real=d.parse.title,p=piece();
  if(count){S.stations++;p.stations++}
  S.article=real;if(!noHistory){S.history.push(real);if(S.history.length>80)S.history=S.history.slice(-80)}
  else if(!S.history.length||S.history[S.history.length-1]!==real)S.history.push(real);

async function measureHeat(A,text){
  const p=piece();if(!p)return;const T=p.title;
  if(A===T){setHeat(4);save();setTimeout(()=>solvePiece(true),500);return}
  setHeat(-1);
  try{
    const r=await api({action:'query',titles:A+'|'+T,prop:'links|categories',pltitles:A+'|'+T,pllimit:'max',clshow:'!hidden',cllimit:'max'});
    if(S.article!==A||piece()!==p)return;
    const pages=(r.query&&r.query.pages)||[],pA=pages.find(x=>x.title===A)||{},pT=pages.find(x=>x.title===T)||{};
    const at=(pA.links||[]).some(l=>l.title===T),ta=(pT.links||[]).some(l=>l.title===A);
    const tc=new Set((pT.categories||[]).map(c=>c.title)),shared=(pA.categories||[]).some(c=>tc.has(c.title));
    const mention=base(T).length>2&&text.includes(base(T));
    let h=0;if(at&&ta)h=3;else if(at||ta||mention)h=2;else if(shared)h=1;
    setHeat(h);S.coldStreak=h===0?(S.coldStreak||0)+1:0;save();renderSide();
  }catch(e){setHeat(0)}
}

/* ---------- gate ---------- */
const STOPW=new Set(['אשר','היה','הייתה','היו','שהיה','שהייתה','גם','כאשר','בין','אחד','אחת','לאחר','לפני','מאוד','אולם','אך','כמו','עם','על','אל','את','של','כי','לא','זה','זו','הוא','היא','הם','הן','כל','עוד','בשנת','שנת','ובו','בה','בו','יותר','ביותר','כדי','במהלך','עד','אף','רק']);
const cleanTok=t=>t.replace(/^[\(\[«"'״׳,;:.\-–]+|[\)\]»"'״׳,;:.!?\-–]+$/g,'');
const isWord=w=>/^[\u05D0-\u05EA][\u05D0-\u05EA'״׳"-]{2,}$/.test(w)||/^\d{2,4}$/.test(w);
function buildGate(a){
  const block=a.closest('p,li,dd');if(!block)return null;
  const linkText=a.textContent.trim();
  const text=block.textContent.replace(/\[\d+\]/g,'').replace(/\s+/g,' ').trim();
  const sents=text.split(/(?<=[.!?])\s+/);
  let sent=sents.find(s=>s.includes(linkText))||(text.length<240?text:null);
  if(!sent||sent.split(' ').length<6)return null;
  const linkWords=new Set(linkText.split(/\s+/).map(cleanTok));
  const toks=sent.split(' ');
  const cand=toks.map((t,i)=>({i,w:cleanTok(t)})).filter(x=>isWord(x.w)&&!linkWords.has(x.w)&&!STOPW.has(x.w));
  if(!cand.length)return null;
  let pick;
  if(S.level==='kids'){const nums=cand.filter(x=>/^\d/.test(x.w));const mid=cand.filter(x=>x.w.length>=3&&x.w.length<=6);pick=(nums.length?nums:mid.length?mid:cand)[Math.floor(Math.random()*(nums.length?nums.length:mid.length?mid.length:cand.length))]}
  else if(S.level==='adults'){pick=cand.slice().sort((x,y)=>y.w.length-x.w.length)[0]}
  else pick=cand[Math.floor(Math.random()*cand.length)];
  const ans=pick.w,isNum=/^\d/.test(ans),nOpt=(S.level==='kids'||S.diff==='easy')?2:3;
  const pool=($('#article').textContent.match(isNum?/\b\d{2,4}\b/g:/[\u05D0-\u05EA][\u05D0-\u05EA'״׳"-]{2,}/g)||[]).map(cleanTok).filter(w=>w&&w!==ans&&!STOPW.has(w)&&!sent.includes(w));
  let opts=[...new Set(pool.filter(w=>Math.abs(w.length-ans.length)<=2))];
  opts=shuffle(opts).slice(0,nOpt);
  if(isNum)while(opts.length<nOpt){const n=String(+ans+(Math.floor(Math.random()*40)-20));if(n!==ans&&!opts.includes(n)&&+n>0)opts.push(n)}
  if(opts.length<nOpt)return null;
  const shown=toks.map((t,i)=>i===pick.i?t.replace(ans,'\u0000'):t).join(' ');
  const html=esc(shown).replace('\u0000','<span class="blank" aria-label="מילה חסרה"></span>');
  return {html,ans,opts:shuffle([ans,...opts])};
}
function onLink(a){
  if(busy)return;const t=a.dataset.wt;if(!t)return;
  S.moves++;
  const ge=dc().gate[S.level]||1,need=S.moves%ge===0;
  const g=need?buildGate(a):null;
  if(!g){loadArticle(t);return}
  const m=document.createElement('div');m.className='shade';
  m.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="gH"><span class="stamp">שער</span><h2 id="gH">לפני שיוצאים אל "${esc(t)}"</h2><p style="margin:0;color:var(--ink-2)">איזו מילה חסרה במשפט מהערך?</p><div class="gate-text">${g.html}</div><div class="opts">${g.opts.map(o=>`<button data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div><div class="err" id="gateMsg" style="color:var(--ink-2)"></div><div><button class="ghost" id="gCancel">להישאר כאן</button></div></div>`;
  $('#modalRoot').appendChild(m);m.querySelector('.opts button').focus();
  $('#gCancel').onclick=()=>{S.moves--;m.remove()};
  m.querySelector('.opts').onclick=e=>{
    const b=e.target.closest('button');if(!b||m.dataset.done)return;m.dataset.done=1;
    const right=b.dataset.o===g.ans;
    m.querySelectorAll('.opts button').forEach(x=>{if(x.dataset.o===g.ans)x.classList.add('right')});
    if(right){S.gatesOk++;$('#gateMsg').textContent='נכון. יוצאים לדרך.'}
    else{b.classList.add('wrong');S.gatesBad++;S.stations++;piece().stations++;$('#gateMsg').textContent='לא מדויק. זה עלה תחנה אחת.'}
    setTimeout(()=>{m.remove();loadArticle(t)},right?700:1600);
  };
}

/* ---------- solving ---------- */
async function solvePiece(arrived){
  const p=piece();if(p.solved)return;p.solved=true;save();
  let ex='';try{const r=await api({action:'query',prop:'extracts',exintro:1,explaintext:1,exsentences:2,titles:p.title});ex=((r.query&&r.query.pages||[])[0]||{}).extract||''}catch(e){}
  p.extract=ex;save();
  const last=S.cur===S.pieces.length-1;
  const m=document.createElement('div');m.className='shade';
  m.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="sH"><span class="stamp">${arrived?'הגעת אל היעד':'ניחוש נכון'}</span><h2 id="sH">${esc(base(p.title))}</h2>${ex?`<p style="margin:0;font-family:var(--font-read);font-size:18px;color:var(--ink-2)">${esc(ex)}</p>`:''}<p class="label" style="margin:0">${p.stations} תחנות בחלק הזה</p><div><button class="primary" id="nextBtn">${last?'לחידה הגדולה':'לערך הנסתר הבא'}</button></div></div>`;
  $('#modalRoot').appendChild(m);$('#nextBtn').focus();
  $('#nextBtn').onclick=()=>{m.remove();if(last){S.phase='meta';save();renderMeta()}else{S.cur++;S.heat=0;S.startPick=null;save();renderStart()}};
}
function metaChoices(P){
  if(!S.metaMc){S.metaMc=shuffle([P.meta.a,...shuffle(PUZZLES.filter(z=>z.id!==P.id).map(z=>z.meta.a)).slice(0,3)]);S.metaOut=[];save()}
  return S.metaMc;
}
function renderMeta(){
  S.phase='meta';renderStats();startTimer();
  const P=puzzle(),ans=base(P.meta.a);
  const letters=[...ans].map((ch,i)=>ch===' '?'&nbsp;&nbsp;':(i<S.metaHints?esc(ch):'_')).join(' ');
  $('#app').innerHTML=`<div class="pick">
    <div><span class="stamp">החידה הגדולה</span></div>
    <div class="clue-hero">${esc(P.meta.q)}</div>
    <div class="pieces">${S.pieces.map(x=>`<span class="piece done" style="font-size:17px;padding:6px 14px">${esc(base(x.title))}</span>`).join('')}</div>
    <div class="card" style="display:grid;gap:10px;max-width:560px">
      <div class="label">התשובה</div><div style="font-family:var(--font-read);font-size:24px;letter-spacing:.06em" dir="rtl">${letters}</div>
      <div class="row"><input id="metaIn" placeholder="הפתרון" autocomplete="off"><button class="primary" id="metaBtn">לפתור</button></div>
      <div class="err" id="metaErr"></div>
      ${showChoices(S.metaWrong)?`<div class="label">או בחר מתוך האפשרויות:</div><div class="opts" id="metaOpts">${metaChoices(P).map(t=>`<button data-t="${esc(t)}" ${(S.metaOut||[]).includes(t)?'class="wrong" disabled':''}>${esc(t)}</button>`).join('')}</div>`:''}
      <div class="row"><button class="ghost" id="hintBtn">לחשוף אות (10- נקודות)</button><button class="ghost" id="giveBtn">לוותר ולראות</button></div>
    </div></div>`;
  const inp=$('#metaIn');inp.focus();inp.addEventListener('input',()=>$('#metaErr').textContent='');
  const go=()=>{const v=inp.value.trim();if(!v){$('#metaErr').textContent='כתוב פתרון קודם';return}
    if(normSet([P.meta.a,...P.meta.al]).has(norm(v))){S.metaSolved=true;finish()}
    else{S.metaWrong++;save();if(showChoices(S.metaWrong)&&!$('#metaOpts'))renderMeta();$('#metaErr').textContent='עדיין לא. מה משותף לכל הערכים?'}};
  const mo=$('#metaOpts');if(mo)mo.onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
    if(b.dataset.t===P.meta.a){b.classList.add('right');S.metaSolved=true;setTimeout(finish,500)}
    else{S.metaWrong++;S.metaOut=[...(S.metaOut||[]),b.dataset.t];save();renderMeta();$('#metaErr').textContent='עדיין לא. מה משותף לכל הערכים?'}};
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});$('#metaBtn').onclick=go;
  $('#hintBtn').onclick=()=>{if(S.metaHints<ans.replace(/\s/g,'').length-1){S.metaHints++;save();renderMeta()}};
  $('#giveBtn').onclick=()=>{S.gaveUp=true;finish()};
}
function computeScore(){
  const solved=S.pieces.filter(p=>p.solved).length,bought=S.pieces.reduce((a,p)=>a+p.bought,0),wrong=S.pieces.reduce((a,p)=>a+p.wrong,0);
  const parts=[['ערכים שפוצחו',solved*100],['תחנות',-2*S.stations],['רמזים שנקנו',-3*bought],['מצפן',-3*(S.compass||0)],['ניחושים שגויים',-3*wrong],['שערים נכונים',3*S.gatesOk],['החידה הגדולה',S.metaSolved?60:0],['אותיות שנחשפו',-10*S.metaHints],['ניסיונות שגויים בחידה',-5*S.metaWrong]];
  const sum=Math.max(0,parts.reduce((a,x)=>a+x[1],0)),m=dc().mult;
  if(m!==1)parts.push([`מכפיל רמה (${DIFFS[S.diff]}) ×${m}`,Math.round(sum*m)-sum]);
  return {parts,total:Math.round(sum*m)};
}
function finish(){
  S.phase='done';clearInterval(timerId);
  const sc=computeScore(),P=puzzle();
  const entry={name:S.name,answer:base(P.meta.a),score:sc.total,stations:S.stations,time:S.timeMs,level:S.level,diff:S.diff||'medium',date:new Date().toISOString().slice(0,10)};
  let b=board();b.push(entry);b.sort((x,y)=>y.score-x.score||x.time-y.time);b=b.slice(0,50);
  try{localStorage.setItem(LS_BOARD,JSON.stringify(b))}catch(e){}
  clearSaved();renderStats();
  const rank=b.indexOf(entry)+1;
  $('#app').innerHTML=`<div class="end">
    <div><span class="stamp">${S.gaveUp?'החידה נחשפה':'החידה נפתרה'}</span></div>
    <h1 style="font-size:clamp(34px,6vw,52px);font-weight:900">${esc(P.meta.a)}</h1>
    <div class="card" style="display:flex;flex-wrap:wrap;gap:24px;align-items:center">
      <div><div class="label">ניקוד</div><div class="score-big">${sc.total}</div><div class="label">מקום ${rank} בטבלה · ${S.stations} תחנות · ${fmtTime(S.timeMs)}</div></div>
      <table class="board" style="flex:1;min-width:220px"><tbody>${sc.parts.filter(x=>x[1]).map(x=>`<tr><td>${x[0]}</td><td style="text-align:end">${x[1]>0?'+':''}${x[1]}</td></tr>`).join('')}</tbody></table>
    </div>
    <div class="card"><h3 style="margin-bottom:10px">מה גילית בדרך</h3><div class="learned">${S.pieces.map(p=>`<div><b>${esc(base(p.title))}</b>${p.extract?`<p>${esc(p.extract)}</p>`:''}</div>`).join('')}</div></div>
    <div class="card"><h3 style="margin-bottom:8px">טבלת השיאים במכשיר הזה</h3>${boardTable(b.slice(0,10))}</div>
    <div><button class="primary" id="againBtn">חידה חדשה</button></div>
  </div>`;
  $('#againBtn').onclick=renderSetup;
  S=null;
}

document.addEventListener('keydown',e=>{if(e.key==='Escape'){const m=document.querySelector('#gCancel');if(m)m.click()}});
renderSetup();
</script>
