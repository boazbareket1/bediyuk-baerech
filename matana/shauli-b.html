<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מתנה לשאולי</title>
<meta property="og:title" content="מתנה לשאולי">
<meta property="og:description" content="חבילת יום הולדת מיפעת ובעז: ארבעה כלים לראש וללב. לחיצה פותחת את החבילה.">
<meta name="description" content="חבילת יום הולדת מיפעת ובעז: ארבעה כלים לראש וללב. לחיצה פותחת את החבילה.">
<meta property="og:image" content="https://boazbareket1.github.io/bediyuk-baerech/matana/og-balloons.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Suez+One&family=Frank+Ruhl+Libre:wght@400;500;700&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: a wrapped parcel on patterned paper; tap to unwrap into a greeting card holding the apps */
:root{
  --paper:#F3EDE3; --pattern:#E6DCCB; --wrap:#1F4E5F; --wrap-2:#2A6478; --ribbon:#D9603B; --ribbon-dk:#A9442A;
  --card:#FFFCF7; --ink:#1E2A2F; --ink-2:#5B6A6E; --line:#E3D9C9; --gold:#C99A2E;
  --display:"Suez One","Frank Ruhl Libre",serif; --read:"Frank Ruhl Libre","Times New Roman",serif; --ui:"Rubik",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#171C1E; --pattern:#20282B; --wrap:#2E6B80; --wrap-2:#3A7C92; --ribbon:#E9785A; --ribbon-dk:#C25D40;
  --card:#22292C; --ink:#EDE6DA; --ink-2:#A9B3B3; --line:#344044; --gold:#E2B858; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#171C1E; --pattern:#20282B; --wrap:#2E6B80; --wrap-2:#3A7C92; --ribbon:#E9785A; --ribbon-dk:#C25D40;
  --card:#22292C; --ink:#EDE6DA; --ink-2:#A9B3B3; --line:#344044; --gold:#E2B858; color-scheme:dark}
/* skins: balloons and flowers override the wrapping colors (light and dark) */
html[data-skin="balloons"]{--paper:#FBF1EE;--pattern:#F1DCD6;--wrap:#E0A33A;--wrap-2:#EBBA5E;--ribbon:#C93F6B;--ribbon-dk:#A12F55}
html[data-skin="flowers"]{--paper:#EEF2EA;--pattern:#DCE4D5;--wrap:#6E9473;--wrap-2:#86AB8B;--ribbon:#C7647F;--ribbon-dk:#A24C66}
@media (prefers-color-scheme: dark){
 html[data-skin="balloons"]:not([data-theme="light"]){--paper:#201719;--pattern:#2C2023;--wrap:#C98D2A;--wrap-2:#D9A346;--ribbon:#E66A92;--ribbon-dk:#E66A92}
 html[data-skin="flowers"]:not([data-theme="light"]){--paper:#151B17;--pattern:#202923;--wrap:#5E8463;--wrap-2:#739A78;--ribbon:#E08AA2;--ribbon-dk:#E08AA2}}
html[data-theme="dark"][data-skin="balloons"]{--paper:#201719;--pattern:#2C2023;--wrap:#C98D2A;--wrap-2:#D9A346;--ribbon:#E66A92;--ribbon-dk:#E66A92}
html[data-theme="dark"][data-skin="flowers"]{--paper:#151B17;--pattern:#202923;--wrap:#5E8463;--wrap-2:#739A78;--ribbon:#E08AA2;--ribbon-dk:#E08AA2}
.deco{position:absolute;inset:0;pointer-events:none;z-index:6}
.bal{position:absolute;bottom:88%;width:54px;height:66px;border-radius:50% 50% 48% 48%/55% 55% 45% 45%;transition:transform 1.4s cubic-bezier(.3,.6,.3,1),opacity 1.4s}
.bal::after{content:"";position:absolute;top:100%;left:50%;width:1.5px;height:70px;background:var(--ink-2);opacity:.5}
.bal.b1{right:-6%;background:#C93F6B;transform:rotate(8deg)}.bal.b2{right:30%;bottom:104%;background:#3F8FB7;width:60px;height:72px}.bal.b3{left:-4%;background:#E0A33A;transform:rotate(-8deg)}
.parcel.open .bal{transform:translateY(-480px) rotate(0);opacity:0}
.fl{position:absolute;width:20px;height:20px;border-radius:50%;background:#F2C14E;top:-4%;
  box-shadow:0 -17px 0 -3px var(--fc),0 17px 0 -3px var(--fc),17px 0 0 -3px var(--fc),-17px 0 0 -3px var(--fc),12px 12px 0 -3px var(--fc),-12px -12px 0 -3px var(--fc),12px -12px 0 -3px var(--fc),-12px 12px 0 -3px var(--fc);transition:transform 1s,opacity 1s}
.fl.f1{--fc:#E8A0B4;right:6%}.fl.f2{--fc:#F4F0E8;right:62%;top:-10%}.fl.f3{--fc:#B9A3D9;left:8%;top:-2%}
.leaf{position:absolute;top:2%;width:26px;height:12px;background:#4F7A55;border-radius:0 100% 0 100%}
.leaf.l1{right:16%;transform:rotate(-30deg)}.leaf.l2{left:20%;transform:rotate(200deg)}
.parcel.open .fl,.parcel.open .leaf{transform:translateY(-120px) scale(1.4);opacity:0}
html[data-skin="flowers"] .bow,html[data-skin="balloons"] .bow{display:none}
html[data-skin="balloons"] .parcel{margin-top:96px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink)}
body{font-family:var(--ui);font-size:17px;line-height:1.6;
  background-image:radial-gradient(var(--pattern) 2px,transparent 2.5px),radial-gradient(var(--pattern) 2px,transparent 2.5px);
  background-size:28px 28px;background-position:0 0,14px 14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px))}
.stage{max-width:520px;margin:0 auto;display:grid;gap:22px;justify-items:center}
.to{font-family:var(--display);font-size:clamp(30px,8vw,44px);line-height:1.15;text-align:center;text-wrap:balance;margin:8px 0 0}
.to small{display:block;font-family:var(--ui);font-size:15px;color:var(--ink-2);font-weight:400;margin-bottom:4px}
/* parcel */
.parcel{position:relative;width:min(300px,78vw);aspect-ratio:1/0.92;margin-top:30px;cursor:pointer;border:0;padding:0;background:none;max-width:100%}
.box,.lid{position:absolute;left:0;right:0;background:var(--wrap);border-radius:10px;
  background-image:repeating-linear-gradient(45deg,transparent 0 14px,color-mix(in srgb,var(--wrap-2) 70%,transparent) 14px 16px)}
.box{bottom:0;height:74%}
.lid{top:6%;height:24%;left:-5%;right:-5%;z-index:2;transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .9s}
.rib-v{position:absolute;top:6%;bottom:0;left:50%;width:15%;transform:translateX(-50%);background:var(--ribbon);z-index:3;transition:opacity .5s}
.rib-h{position:absolute;bottom:30%;left:0;right:0;height:13%;background:var(--ribbon);z-index:1}
.bow{position:absolute;top:-8%;left:50%;transform:translateX(-50%);width:46%;height:22%;z-index:4;transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .9s}
.bow::before,.bow::after{content:"";position:absolute;top:0;width:50%;height:100%;border:9px solid var(--ribbon);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:transparent}
.bow::before{left:0;transform:rotate(-18deg)}.bow::after{right:0;transform:rotate(18deg)}
.tag{position:absolute;bottom:8%;right:-6%;z-index:5;background:var(--card);color:var(--ink);font-family:var(--read);font-size:16px;padding:6px 12px;border-radius:6px;border:1px solid var(--line);transform:rotate(-6deg);box-shadow:0 2px 0 var(--line)}
.parcel:hover .lid{transform:translateY(-4px) rotate(-1deg)}
.parcel.open .lid{transform:translateY(-140%) rotate(-14deg);opacity:0}
.parcel.open .bow{transform:translate(-50%,-260%) rotate(20deg);opacity:0}
.parcel.open .rib-v{opacity:0}
.parcel:focus-visible{outline:3px solid var(--ribbon);outline-offset:8px;border-radius:12px}
.cta{font-family:var(--ui);font-size:18px;font-weight:500;background:var(--ribbon);color:#fff;border:0;border-radius:999px;padding:12px 26px;cursor:pointer}
.cta:hover{background:var(--ribbon-dk)}
.hint{color:var(--ink-2);font-size:14px;margin:-10px 0 0}
/* card */
.card{width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 22px 22px;display:grid;gap:18px;
  box-shadow:0 18px 40px -24px rgba(0,0,0,.35);animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{transform:translateY(40px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.card h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,9vw,48px);line-height:1.1;margin:0;color:var(--ribbon-dk);text-wrap:balance}
:root[data-theme="dark"] .card h1{color:var(--ribbon)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .card h1{color:var(--ribbon)}}
.msg{font-family:var(--read);font-size:19px;line-height:1.7;white-space:pre-line;margin:0}
.sign{font-family:var(--read);font-size:19px;font-weight:700;margin:0}
.inside{font-size:13px;letter-spacing:.06em;color:var(--gold);font-weight:700;border-top:1px dashed var(--line);padding-top:14px;margin:0}
.apps{display:grid;gap:12px}
.app{display:grid;gap:6px;border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--paper);background-image:none}
.app h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0;line-height:1.2}
.app p{margin:0;color:var(--ink-2);font-family:var(--read);font-size:17px}
.app .idea{font-size:15px;color:var(--ink);font-family:var(--ui)}
.app .idea b{color:var(--ribbon-dk);font-weight:500}
.app a{justify-self:start;margin-top:6px;text-decoration:none;font-weight:500;background:var(--wrap);color:#fff;border-radius:999px;padding:9px 18px}
.app a:hover{background:var(--wrap-2)}
.app a:focus-visible,.cta:focus-visible{outline:3px solid var(--ribbon);outline-offset:3px}
/* thank-you corner */
.thanks{border-top:1px dashed var(--line);padding-top:16px;display:grid;gap:10px}
.thanks h3{font-family:var(--display);font-weight:400;font-size:24px;margin:0;line-height:1.2}
.thanks p{margin:0;color:var(--ink-2);font-size:15px}
.thanks .tried{color:var(--ink);font-weight:500}
.thanks textarea{font:inherit;font-family:var(--read);font-size:17px;line-height:1.6;color:var(--ink);background:var(--paper);background-image:none;border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:110px;resize:vertical}
.tbtns{display:flex;flex-wrap:wrap;gap:8px}
.tbtn{font:inherit;font-size:15px;font-weight:500;border-radius:999px;padding:9px 18px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;border:1.5px solid var(--wrap);background:transparent;color:var(--wrap)}
.tbtn.main{background:#1E8E4F;border-color:#1E8E4F;color:#fff}
.tbtn:focus-visible{outline:3px solid var(--ribbon);outline-offset:3px}
.tnote{font-size:13px;color:var(--ink-2)}
footer{font-size:13px;color:var(--ink-2);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="stage">
  <p class="to" id="to"></p>
  <button class="parcel" id="parcel" aria-label="לפתוח את המתנה">
    <span class="bow"></span><span class="lid"></span><span class="rib-v"></span><span class="rib-h"></span><span class="box"></span>
    <span class="tag" id="tag"></span><span class="deco" id="deco" aria-hidden="true"></span>
  </button>
  <button class="cta" id="openBtn">לפתוח את המתנה</button>
  <p class="hint" id="hint">אפשר גם ללחוץ על החבילה</p>
  <section class="card" id="card" hidden aria-live="polite"></section>
  <footer id="foot" hidden></footer>
</main>
<script>
const GIFT={"occasion": "יום הולדת", "toLine": "שאולי, הגיעה אליך חבילה", "tag": "לשאולי, מיפעת ובעז", "headline": "מזל טוב, שאולי!", "signature": "באהבה, יפעת ובעז", "insideLabel": "בתוך החבילה", "ideaLabel": "איך מתחילים:", "footer": "רוצים לשלוח מתנה כזו למישהו? למדף המתנות", "footerHref": "./", "file": "shauli-b.html", "title": "מתנה לשאולי", "ogDesc": "חבילת יום הולדת מיפעת ובעז: ארבעה כלים לראש וללב. לחיצה פותחת את החבילה.", "tools": ["family-weave", "numerology", "bediyuk-baerech", "mazalot"], "message": "ליום ההולדת שלך ארזנו משהו שלא צריך לעטוף בנייר: כלים לראש וללב, לרגעים פנויים ולשולחן עם החברים.\nשתהיה לך שנה של טבע, אהבה, שמחה, שפע, סקרנות, צחוק וחיבורים טובים.", "skin": "balloons", "from": "יפעת ובעז", "to": "שאולי", "apps": [{"name": "המארג המשפחתי", "what": "מעגל התפתחות נומרולוגי: כל אחד מצטרף בסריקת QR ומקבל מפה אישית, ויחד חושפים שליחות, תפקידים, חוטים וחיכוכים. כולל תצוגת הנחיה להקראה ומשחק זיהוי.", "idea": "עוברים סביב השולחן, מכניסים את כל מי שיושב בו, וקוראים יחד מה כל אחד מביא למשפחה.", "url": "https://boazbareket1.github.io/family-weave/?s=gift", "button": "לפתוח"}, {"name": "מפת המספרים", "what": "ניתוח אישיות לפי תאריך הלידה והשם, בגימטריה עברית ובשיטה הפיתגוראית, כולל התאמה זוגית ותחזית.", "idea": "מכניסים את התאריך שלך, ואחר כך בודקים יחד את ההתאמה הזוגית.", "url": "https://boazbareket1.github.io/numerology-map/?s=gift", "button": "לפתוח"}, {"name": "בדיוק בערך", "what": "משחק חידות בוויקיפדיה: קוראים ערכים, אוספים רמזים ומגלים ערכים נסתרים שיחד פותרים חידה גדולה.", "idea": "כל אחד בטלפון שלו, אותה רמת קושי, ומי שפותר ראשון מנצח.", "url": "https://boazbareket1.github.io/bediyuk-baerech/?s=gift", "button": "לפתוח"}, {"name": "מזלות", "what": "מזינים תאריך לידה, מגלים את תכונות המזל, מדרגים מה נוכח בך ומה חשוב לך, בודקים התאמה זוגית ושולחים לעצמך סיכום אישי.", "idea": "כל אחד מדרג את עצמו, ואחר כך משווים.", "url": "https://boazbareket1.github.io/Mazalot/?s=gift", "button": "לפתוח"}]};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.title=GIFT.title;
const SKIN=['box','balloons','flowers'].includes(GIFT.skin)?GIFT.skin:'box';document.documentElement.dataset.skin=SKIN;
document.getElementById('deco').innerHTML=SKIN==='balloons'?'<i class="bal b1"></i><i class="bal b2"></i><i class="bal b3"></i>':SKIN==='flowers'?'<i class="leaf l1"></i><i class="leaf l2"></i><i class="fl f1"></i><i class="fl f2"></i><i class="fl f3"></i>':'';
document.getElementById('to').innerHTML=`<small>${esc(GIFT.occasion)}</small>${esc(GIFT.toLine)}`;
document.getElementById('tag').textContent=GIFT.tag;
const FROM=(GIFT.from||(GIFT.signature||'').replace(/^באהבה,\s*/,'')).trim();
const TO=(GIFT.to||(GIFT.tag||'').replace(/^ל/,'').split(',')[0]).trim();
const tried=new Set();
function thanksHtml(){
  const who=FROM||'מי ששלח לך את המתנה';
  return `<section class="thanks" aria-labelledby="thH"><h3 id="thH">ניסית? כדאי לספר ל${esc(FROM||"מי ששלח")}</h3>
    <p id="thLead">קודם כדאי לפתוח את הכלים ולשחק בהם קצת. אחר כך חוזרים לכאן ושולחים ל${esc(who)} כמה מילים: מה אהבת, מה גילית, או רק שהמתנה הגיעה.</p>
    <div class="tbtns"><button class="tbtn" id="thQuick" type="button">רק לאשר שהמתנה הגיעה</button><button class="tbtn" id="thWrite" type="button">לכתוב תודה אישית</button></div>
    <div id="thBox" hidden style="display:grid;gap:8px"><label for="thText" class="tnote">התודה שלך (אפשר לשנות הכול)</label><textarea id="thText"></textarea>
      <div class="tbtns"><a class="tbtn main" id="thSend" href="#" target="_blank" rel="noopener">לשלוח בוואטסאפ</a></div>
      <p class="tnote">וואטסאפ ייפתח עם ההודעה. בוחרים את הצ'אט עם ${esc(who)} ושולחים.</p></div></section>`;
}
function draft(){
  const names=[...tried];
  const hi=(FROM?'היי '+FROM+',':'היי,');
  const body=names.length?`ניסיתי את ${names.join(' ואת ')}, ו`:'פתחתי את המתנה, ו';
  return `${hi}\n${body}...\nתודה רבה על המתנה!${TO?'\n'+TO:''}`;
}
const waUrl=txt=>'https://wa.me/?text='+encodeURIComponent(txt);
function bindThanks(){
  const box=document.getElementById('thBox'),ta=document.getElementById('thText'),send=document.getElementById('thSend');
  const sync=()=>{send.href=waUrl(ta.value.trim()||draft())};
  document.getElementById('thWrite').onclick=()=>{box.hidden=false;if(!ta.dataset.touched)ta.value=draft();sync();ta.focus()};
  ta.addEventListener('input',()=>{ta.dataset.touched='1';sync()});
  document.getElementById('thQuick').onclick=()=>{
    const msg=`${FROM?'היי '+FROM+', ':''}המתנה הגיעה ונפתחה. תודה רבה! בקרוב אנסה את הכלים.${TO?'\n'+TO:''}`;
    window.open(waUrl(msg),'_blank','noopener')};
  document.querySelectorAll('[data-tool]').forEach(a=>a.addEventListener('click',()=>{tried.add(a.dataset.tool);try{sessionStorage.setItem('gift.tried',JSON.stringify([...tried]))}catch(e){}}));
  try{JSON.parse(sessionStorage.getItem('gift.tried')||'[]').forEach(n=>tried.add(n))}catch(e){}
  showTried();
}
function showTried(){
  const lead=document.getElementById('thLead');if(!lead||!tried.size)return;
  lead.innerHTML=`<span class="tried">חזרת מ${esc([...tried].join(' ומ'))}? איך היה?</span> זה הזמן לשלוח ל${esc(FROM||'מי ששלח לך')} כמה מילים.`;
  const ta=document.getElementById('thText');if(ta&&!ta.dataset.touched&&!document.getElementById('thBox').hidden){ta.value=draft();document.getElementById('thSend').href=waUrl(draft())}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)showTried()});
function open(){
  const p=document.getElementById('parcel');if(p.classList.contains('open'))return;
  p.classList.add('open');document.getElementById('openBtn').hidden=true;document.getElementById('hint').hidden=true;
  setTimeout(()=>{
    p.hidden=true;
    const c=document.getElementById('card');
    c.innerHTML=`<h1>${esc(GIFT.headline)}</h1><p class="msg">${esc(GIFT.message)}</p><p class="sign">${esc(GIFT.signature)}</p>
      <p class="inside">${esc(GIFT.insideLabel)}</p>
      <div class="apps">${GIFT.apps.map(a=>`<article class="app"><h2>${esc(a.name)}</h2><p>${esc(a.what)}</p>${a.idea?`<div class="idea"><b>${esc(GIFT.ideaLabel)}</b> ${esc(a.idea)}</div>`:''}<a href="${esc(a.url)}" target="_blank" rel="noopener" data-tool="${esc(a.name)}">${esc(a.button||'לפתוח')} ←</a></article>`).join('')}</div>${thanksHtml()}`;
    c.hidden=false;bindThanks();
    const f=document.getElementById('foot');f.innerHTML=GIFT.footerHref?`<a href="${esc(GIFT.footerHref)}" style="color:inherit">${esc(GIFT.footer)}</a>`:esc(GIFT.footer||'');f.hidden=!GIFT.footer;
  },matchMedia('(prefers-reduced-motion: reduce)').matches?0:750);
}
document.getElementById('parcel').onclick=open;document.getElementById('openBtn').onclick=open;
</script>
</body>
</html>
